name: Update MAGI release branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-magi.yml"

  schedule:
    - cron: "45 15 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update MAGI branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/JamePeng/llama-cpp-python/releases/latest" |
              jq -er '.tag_name'
          )"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          echo "Latest release tag: $TAG"

          git remote add release-upstream \
            https://github.com/JamePeng/llama-cpp-python.git

          git fetch --force --no-tags release-upstream \
            "refs/tags/${TAG}:refs/tags/${TAG}"

          COMMIT="$(git rev-parse --verify "${TAG}^{commit}")"

          echo "Release commit: $COMMIT"

          git push origin \
            "${COMMIT}:refs/heads/MAGI"
